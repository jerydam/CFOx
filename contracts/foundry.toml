[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
verbosity = 5
[profile.default.fuzz]
runs = 1000

[rpc_endpoints]
celo = "${CELO_RPC_URL}"
botchain = "${BOTCHAIN_RPC_URL}"

[etherscan]
celo = { key = "${CELOSCAN_API_KEY}", url = "https://api.celoscan.io/api" }
