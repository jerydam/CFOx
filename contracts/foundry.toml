[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
verbosity = 5
[profile.default.fuzz]
runs = 1000

[rpc_endpoints]
celo = "${CELO_RPC_URL}"
celo_sepolia = "https://forno.celo-sepolia.celo-testnet.org"
botchain = "${BOTCHAIN_RPC_URL}"
[etherscan]
celo_sepolia = { key = "any", url = "https://celo-sepolia.blockscout.com/api/" }
celo = { key = "${CELOSCAN_API_KEY}", url = "https://api.celoscan.io/api" }
botchain = { key = "any", url = "https://scan.bohr.life/api", chain = 677 }